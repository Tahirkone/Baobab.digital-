name: Build BAOBAB DIGITAL CLIENT
on:
  pull_request:
    paths:
      - "client/**"
  push:
    branches:
      - main
    paths:
      - "client/**"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
