name: Build CYBER Android APKs
on:
  pull_request:
    paths:
      - "client/**"
      - "gestion/**"
      - ".github/workflows/android-apks.yml"
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "gestion/**"
      - ".github/workflows/android-apks.yml"
jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, gestion]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: ${{ matrix.app }}
        run: npm run build
      - name: Generate Android project
        working-directory: ${{ matrix.app }}
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: ${{ matrix.app }}
        run: npx cap sync android
      - name: Render CYBER launcher icon
        working-directory: ${{ matrix.app }}
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 - <<'PY'
          import cairosvg
          from pathlib import Path
          from PIL import Image
          cairosvg.svg2png(url="public/icon.svg", write_to="/tmp/cyber-icon.png", output_width=512, output_height=512)
          source = Image.open("/tmp/cyber-icon.png").convert("RGBA")
          res = Path("android/app/src/main/res")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              if folder.exists():
                  icon = source.resize((size,size), Image.Resampling.LANCZOS)
                  icon.save(folder / "ic_launcher.png")
                  icon.save(folder / "ic_launcher_round.png")
          PY
      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyber-${{ matrix.app }}-android-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Configure Android release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        working-directory: ${{ matrix.app }}/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > cyber-release.jks
          cat >> app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file("../cyber-release.jks")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE
      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleRelease
      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cyber-${{ matrix.app }}-android-release-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
