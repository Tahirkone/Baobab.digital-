name: Build BAOBAB DIGITAL Android APKs
on:
  pull_request:
    paths:
      - "client/**"
      - "gestion/**"
      - ".github/workflows/android-apks.yml"
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "gestion/**"
      - ".github/workflows/android-apks.yml"
jobs:
  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, gestion]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: ${{ matrix.app }}
        run: npm run build
      - name: Generate Android project
        working-directory: ${{ matrix.app }}
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: ${{ matrix.app }}
        run: npx cap sync android
      - name: Apply official BAOBAB DIGITAL launcher icon
        working-directory: ${{ matrix.app }}
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          svg = Path("public/icon.svg").read_text()
          match = re.search(r"base64,([A-Za-z0-9+/=]+)", svg)
          if not match:
              raise SystemExit("Official app icon data not found")
          source = Image.open(BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
          res = Path("android/app/src/main/res")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              if not folder.exists():
                  continue
              icon = source.resize((size,size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")
          PY
      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baobab-digital-${{ matrix.app }}-android-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
