name: Build BAOBAB DIGITAL GESTION

on:
  push:
    branches:
      - main
      - feat/payment-security
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install
        working-directory: gestion
      - name: Vérifier TypeScript et construire l'application
        run: npm run build
        working-directory: gestion
